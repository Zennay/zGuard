<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>zGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header><span class="shield">z</span><div><h1>zGuard</h1><p>Popup Blocker</p></div><label class="switch"><span class="sr-only">zGuard inschakelen</span><input id="enabled" type="checkbox"><span class="track" aria-hidden="true"></span></label></header>
    <p id="site" class="site">Deze site</p>
    <section><h2>Beveiligingsmodus</h2><div class="modes"><button type="button" data-mode="balanced">Gebalanceerd</button><button type="button" data-mode="strict">Streng</button></div></section>
    <section class="stats"><span>Geblokkeerd</span><strong id="count" aria-live="polite" aria-atomic="true">0</strong></section>
    <p id="status" class="status" role="status" aria-live="polite">Actief</p>
  </main>
  <script src="popup.js"></script><script src="popup-a11y.js"></script>
</body>
</html>
