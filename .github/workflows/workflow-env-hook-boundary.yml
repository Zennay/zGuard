name: Workflow environment hook boundary

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/workflows/workflow-env-hook-boundary.yml"
      - "tests/workflow-env-hook-boundary.test.rb"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/workflows/workflow-env-hook-boundary.yml"
      - "tests/workflow-env-hook-boundary.test.rb"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-env-hook-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workflow environment hook boundary contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate workflow environment hooks
        run: ruby tests/workflow-env-hook-boundary.test.rb
