name: Repository ignore integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-repository-ignore-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-ignore-integrity:
    name: Repository ignore-integrity contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Reject tracked files covered by ignore rules
        run: node tests/repository-ignore-integrity.test.mjs
