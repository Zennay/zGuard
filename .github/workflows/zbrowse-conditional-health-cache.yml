name: zBrowse conditional health cache acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_health_no_store:
        description: "Require no-store on all conditional 200/304 GET and HEAD live capacity responses (issue #293)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zbrowse-conditional-health-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conditional-health:
    name: Gateway conditional health cache boundary
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 6
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUIRE_HEALTH_NO_STORE: ${{ inputs.require_health_no_store || 'false' }}
    steps:
      - name: Checkout exact PR-head source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install locked gateway dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix zbrowse/gateway
      - name: Probe real Express GET HEAD and conditional cache behaviour
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.health-cache-real-http.test.mjs
          node tests/zbrowse.health-conditional-real-http.test.mjs
          if [ "$REQUIRE_HEALTH_NO_STORE" = "true" ]; then
            node tests/zbrowse.health-conditional-real-http.test.mjs --require-health-no-store
          fi
          test -z "$(git status --porcelain)"
