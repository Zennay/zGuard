name: zGuard quality validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: zGuard + zBrowse contracts
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify runtime tools
        shell: bash
        run: |
          set -euo pipefail
          node --version
          bash --version | head -n 1

      - name: Validate zGuard extension packages
        run: node tests/smoke.test.js

      - name: Validate zBrowse runtime contracts
        run: bash zbrowse/scripts/validate.sh

      - name: Verify locked zBrowse production install
        working-directory: zbrowse/gateway
        run: npm ci --omit=dev --ignore-scripts --no-audit

      - name: Audit zBrowse production dependencies
        working-directory: zbrowse/gateway
        run: npm audit --omit=dev --audit-level=high
