name: Repository local-config hygiene

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-local-config-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate tracked local-config paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate tracked paths
        run: node tests/repository-sensitive-path-hygiene.test.mjs
