name: Repository executable mode

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-repository-executable-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-executable-mode:
    name: Repository executable-mode contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate executable file modes
        run: node tests/repository-executable-mode.test.mjs
