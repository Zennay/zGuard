name: zBrowse gateway package policy validation

on:
  pull_request:
    paths:
      - "zbrowse/gateway/package.json"
      - "zbrowse/gateway/package-lock.json"
      - "tests/zbrowse.gateway-package-policy.test.mjs"
      - ".github/workflows/gateway-package-policy-validation.yml"
  push:
    branches:
      - main
    paths:
      - "zbrowse/gateway/package.json"
      - "zbrowse/gateway/package-lock.json"
      - "tests/zbrowse.gateway-package-policy.test.mjs"
      - ".github/workflows/gateway-package-policy-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-gateway-package-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-package-policy:
    name: Gateway package policy contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate gateway package policy
        run: node tests/zbrowse.gateway-package-policy.test.mjs
