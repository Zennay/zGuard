name: zBrowse gateway containment validation

on:
  pull_request:
    paths:
      - "zbrowse/docker-compose.yml"
      - "tests/zbrowse.gateway-containment.test.mjs"
      - ".github/workflows/gateway-containment-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-gateway-containment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-containment:
    name: Gateway containment contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate gateway containment
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.gateway-containment.test.mjs
          cd zbrowse
          docker compose config >/dev/null
