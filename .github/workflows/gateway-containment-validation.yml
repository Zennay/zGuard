name: zBrowse gateway containment validation

on:
  pull_request:
    paths:
      - "zbrowse/docker-compose.yml"
      - "zbrowse/gateway/**"
      - "zbrowse/README.md"
      - "zbrowse/scripts/validate.sh"
      - "tests/zbrowse.gateway-containment.test.mjs"
      - "tests/zbrowse.gateway-runtime.test.mjs"
      - "tests/zbrowse.validation-entrypoint.test.mjs"
      - ".github/workflows/gateway-containment-validation.yml"
  push:
    branches:
      - main
    paths:
      - "zbrowse/docker-compose.yml"
      - "zbrowse/gateway/**"
      - "zbrowse/README.md"
      - "zbrowse/scripts/validate.sh"
      - "tests/zbrowse.gateway-containment.test.mjs"
      - "tests/zbrowse.gateway-runtime.test.mjs"
      - "tests/zbrowse.validation-entrypoint.test.mjs"
      - ".github/workflows/gateway-containment-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-gateway-containment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-containment:
    name: Gateway containment contract
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate portable suite and gateway containment
        shell: bash
        run: |
          set -euo pipefail
          bash zbrowse/scripts/validate.sh
          node tests/zbrowse.gateway-containment.test.mjs
          cd zbrowse
          docker compose config >/dev/null

      - name: Boot, health-check and inspect gateway
        shell: bash
        run: |
          set -euo pipefail
          cd zbrowse
          trap 'docker compose down --remove-orphans >/dev/null 2>&1 || true' EXIT
          export DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
          docker compose up -d --build gateway
          healthy=false
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' zbrowse-gateway)"
            if [[ "$status" == "healthy" ]]; then
              healthy=true
              break
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker compose logs gateway
              exit 1
            fi
            sleep 1
          done
          if [[ "$healthy" != "true" ]]; then
            docker compose logs gateway
            echo "Gateway did not become healthy within 30 seconds." >&2
            exit 1
          fi
          node ../tests/zbrowse.gateway-runtime.test.mjs zbrowse-gateway
