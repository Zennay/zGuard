name: Repository symlink safety

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-repository-symlink-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-symlink-safety:
    name: Repository symlink safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate tracked symlinks and file modes
        run: node tests/repository-symlink-safety.test.mjs
