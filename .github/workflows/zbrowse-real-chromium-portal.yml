name: zBrowse real Chromium TV portal acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbrowse-real-chromium-portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal-browser:
    name: Run actual TV portal flows in Chrome for Testing
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR-head source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Lock browser acquisition integrity and retries
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.portal-chrome-download-integrity.test.mjs
      - name: Install immutable Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          CHROME_VERSION=155.0.8059.39
          curl --fail --silent --show-error --location --http1.1 --retry-all-errors --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 150 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip" \
            -o "$RUNNER_TEMP/chrome-for-testing.zip"
          printf '%s  %s\n' \
            '55672d1f392fd3e7b7a08621b6e804e6bcb39d40cf155504abb74b3a021ea8ea' \
            "$RUNNER_TEMP/chrome-for-testing.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/chrome-for-testing.zip" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/chrome-linux64/chrome"
      - name: Exercise shipped TV portal inside real Chromium
        env:
          CHROMIUM_BIN: ${{ runner.temp }}/chrome-linux64/chrome
        shell: bash
        run: |
          set -euo pipefail
          "$CHROMIUM_BIN" --version
          node --check tests/zbrowse.portal-real-chromium.test.mjs
          node tests/zbrowse.portal-real-chromium.test.mjs
          test -z "$(git status --porcelain)"
