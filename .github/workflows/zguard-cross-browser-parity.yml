name: zGuard cross-browser parity

on:
  pull_request:
    paths:
      - "chromium/background.js"
      - "chromium/content.js"
      - "firefox/background.js"
      - "firefox/content.js"
      - "tests/zguard.cross-browser-parity.test.mjs"
      - ".github/workflows/zguard-cross-browser-parity.yml"
  push:
    branches:
      - main
    paths:
      - "chromium/background.js"
      - "chromium/content.js"
      - "firefox/background.js"
      - "firefox/content.js"
      - "tests/zguard.cross-browser-parity.test.mjs"
      - ".github/workflows/zguard-cross-browser-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-cross-browser-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Cross-browser contract parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Validate parity
        run: node tests/zguard.cross-browser-parity.test.mjs
