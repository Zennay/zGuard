name: Repository CSS animation integrity

on:
  pull_request:
    paths:
      - "**/*.css"
      - "tests/repository-css-animation-integrity.test.mjs"
      - ".github/workflows/repository-css-animation-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.css"
      - "tests/repository-css-animation-integrity.test.mjs"
      - ".github/workflows/repository-css-animation-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-repository-css-animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  css-animation-integrity:
    name: Repository CSS animation integrity contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate CSS animation references
        run: node tests/repository-css-animation-integrity.test.mjs
