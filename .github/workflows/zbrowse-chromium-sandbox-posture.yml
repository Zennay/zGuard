name: zBrowse Chromium sandbox posture

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_browser_sandbox:
        description: "Require Chromium process-sandbox flags to remain enabled (issue #16)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zbrowse-chromium-sandbox-posture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-posture:
    name: Chromium sandbox source boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUIRE_BROWSER_SANDBOX: ${{ inputs.require_browser_sandbox || 'false' }}
    steps:
      - name: Checkout exact PR-head source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Validate browser sandbox source posture
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.chromium-sandbox-posture.test.mjs
          if [ "$REQUIRE_BROWSER_SANDBOX" = "true" ]; then
            node tests/zbrowse.chromium-sandbox-posture.test.mjs --require-browser-sandbox
          fi
