name: Workflow container image provenance

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/workflows/workflow-container-image-provenance.yml"
      - "tests/workflow-container-image-provenance.test.rb"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/workflows/workflow-container-image-provenance.yml"
      - "tests/workflow-container-image-provenance.test.rb"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-container-image-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workflow container image provenance contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate container image provenance
        run: ruby tests/workflow-container-image-provenance.test.rb
