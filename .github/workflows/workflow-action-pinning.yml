name: Workflow action pinning

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/workflow-action-pinning.test.mjs"
      - ".github/workflows/workflow-action-pinning.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "tests/workflow-action-pinning.test.mjs"
      - ".github/workflows/workflow-action-pinning.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-workflow-action-pinning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-pinning:
    name: Workflow external action pinning contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate immutable action references
        run: node tests/workflow-action-pinning.test.mjs
