name: zBrowse failed container teardown acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_fail_closed:
        description: "Require failed stop AND removal to preserve session capacity and report error (issue #7)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zbrowse-teardown-failclosed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  teardown:
    name: Gateway container teardown accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUIRE_FAIL_CLOSED: ${{ inputs.require_fail_closed || 'false' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install locked gateway dependencies without scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix zbrowse/gateway
      - name: Exercise production teardown functions with deterministic containers
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.gateway-strict-acceptance-cli.test.mjs
          node tests/zbrowse.teardown-failclosed.test.mjs
          node tests/zbrowse.teardown-admission-real-http.test.mjs
          node tests/zbrowse.shutdown-failed-cleanup.test.mjs
          node tests/zbrowse.shutdown-admission-race-real-http.test.mjs
          if [ "$REQUIRE_FAIL_CLOSED" = "true" ]; then
            node tests/zbrowse.teardown-failclosed.test.mjs --require-fail-closed
            node tests/zbrowse.teardown-admission-real-http.test.mjs --require-fail-closed
            node tests/zbrowse.shutdown-failed-cleanup.test.mjs --require-shutdown-fail-closed
            node tests/zbrowse.shutdown-admission-race-real-http.test.mjs --require-shutdown-drain
          fi
