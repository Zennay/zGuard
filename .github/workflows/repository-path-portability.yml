name: Repository path portability

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-repository-path-portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-path-portability:
    name: Repository path portability contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate tracked paths
        run: node tests/repository-path-portability.test.mjs
