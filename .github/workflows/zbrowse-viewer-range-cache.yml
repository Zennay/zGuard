name: zBrowse viewer conditional Range cache policy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_no_store:
        description: "Require no-store for bearer-bearing viewer GET/HEAD 200/206/304/403/416/502 (issue #284)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zbrowse-viewer-range-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewer-range:
    name: Gateway viewer conditional and Range privacy
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 6
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUIRE_NO_STORE: ${{ inputs.require_no_store || 'false' }}
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install locked gateway dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix zbrowse/gateway
      - name: Exercise source-bound viewer response privacy
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.viewer-cache-real-http.test.mjs
          node tests/zbrowse.viewer-conditional-range-real-http.test.mjs
          # Preserve no-store across 200/206/304/401/403/416/502 and HEAD.
          node tests/zbrowse.viewer-conditional-range-real-http.test.mjs --require-no-store
          if [ "$REQUIRE_NO_STORE" = "true" ]; then
            node tests/zbrowse.viewer-conditional-range-real-http.test.mjs --require-no-store
          fi
          test -z "$(git status --porcelain)"
