name: Deploy zBrowse

on:
  push:
    branches:
      - main
    paths:
      - "zbrowse/**"
      - ".github/workflows/deploy-zbrowse.yml"
  workflow_dispatch:

concurrency:
  group: deploy-zbrowse
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Verify VPS checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying on $(hostname)"
          test -d /opt/zbrowse-source/.git

      - name: Update source
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/zbrowse-source
          git fetch origin main
          git reset --hard origin/main

      - name: Start Docker
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start docker
          sudo systemctl is-active --quiet docker

      - name: Build and deploy zBrowse
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/zbrowse-source/zbrowse

          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          docker_gid="$(stat -c '%g' /var/run/docker.sock)"
          if grep -q '^DOCKER_GID=' .env; then
            sed -i "s/^DOCKER_GID=.*/DOCKER_GID=$docker_gid/" .env
          else
            printf '\nDOCKER_GID=%s\n' "$docker_gid" >> .env
          fi

          bash scripts/validate.sh
          browser_image="$(sed -n 's/^BROWSER_IMAGE=//p' .env | tail -n 1)"
          if [ -z "$browser_image" ]; then
            browser_image="zbrowse-browser:1.0.0"
          fi

          sudo docker build -t "$browser_image" ./browser
          sudo docker compose up -d --build gateway

      - name: Verify gateway
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/api/health; then
              echo
              sudo docker compose -f /opt/zbrowse-source/zbrowse/docker-compose.yml ps
              exit 0
            fi
            sleep 2
          done
          sudo docker compose -f /opt/zbrowse-source/zbrowse/docker-compose.yml logs --tail=100 gateway
          exit 1
