name: zBrowse viewer proxy log privacy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_redacted_proxy_errors:
        description: "Require sanitised proxy failure diagnostics without bearer or credential leaks"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zbrowse-viewer-proxy-log-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proxy-logs:
    name: Gateway viewer proxy error log privacy
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 6
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUIRE_REDACTED_PROXY_ERRORS: ${{ inputs.require_redacted_proxy_errors || 'false' }}
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install locked gateway dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix zbrowse/gateway
      - name: Validate actual HTTP proxy error logging and fail-closed CLI
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.gateway-strict-acceptance-cli.test.mjs
          node tests/zbrowse.viewer-path-recovery-real-http.test.mjs
          node tests/zbrowse.proxy-error-log-privacy-real-http.test.mjs
          # Credential-safe proxy diagnostics are mandatory on PRs and main.
          node tests/zbrowse.proxy-error-log-privacy-real-http.test.mjs --require-redacted-proxy-errors
          if [ "$REQUIRE_REDACTED_PROXY_ERRORS" = "true" ]; then
            node tests/zbrowse.proxy-error-log-privacy-real-http.test.mjs --require-redacted-proxy-errors
          fi
          test -z "$(git status --porcelain)"
