name: zBrowse strict remediation dispatch integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbrowse-strict-dispatch-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-dispatch:
    name: Strict remediation switches execute real tests
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Verify opt-in remediation acceptance bindings
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/zbrowse.strict-dispatch-integrity.test.mjs
          node tests/zbrowse.strict-dispatch-integrity.test.mjs
          test -z "$(git status --porcelain)"
