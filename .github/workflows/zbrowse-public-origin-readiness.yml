name: zBrowse public origin readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbrowse-public-origin-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-readiness:
    name: Verify TV gateway routing contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      LIVE_PROBE_EVENT: ${{ github.event_name }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install locked gateway dependencies without scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix zbrowse/gateway
      - name: Validate safe public gateway read-only probing
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.public-origin-readiness.test.mjs --self-test
          node tests/zbrowse.gateway-public-api-real-http.test.mjs
          if [ "$LIVE_PROBE_EVENT" = "workflow_dispatch" ]; then
            node tests/zbrowse.public-origin-readiness.test.mjs --live
          fi
