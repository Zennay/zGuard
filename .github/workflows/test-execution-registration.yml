name: Test execution registration validation

on:
  pull_request:
    paths:
      - "tests/**"
      - ".github/workflows/**"
      - "**/*.sh"
      - "**/package.json"
      - ".github/workflows/test-execution-registration.yml"
  push:
    branches:
      - main
    paths:
      - "tests/**"
      - ".github/workflows/**"
      - "**/*.sh"
      - "**/package.json"
      - ".github/workflows/test-execution-registration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-execution-registration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Detect orphaned tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate test execution registration
        run: node tests/test-execution-registration.test.mjs
