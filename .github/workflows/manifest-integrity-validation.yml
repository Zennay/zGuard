name: zGuard manifest integrity validation

on:
  pull_request:
    paths:
      - 'chromium/**'
      - 'firefox/**'
      - 'zbrowse/browser/zguard/**'
      - 'tests/zguard.manifest-integrity.test.js'
      - 'tests/zguard.bundle-parity.test.mjs'
      - '.github/workflows/manifest-integrity-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'chromium/**'
      - 'firefox/**'
      - 'zbrowse/browser/zguard/**'
      - 'tests/zguard.manifest-integrity.test.js'
      - 'tests/zguard.bundle-parity.test.mjs'
      - '.github/workflows/manifest-integrity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-manifest-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-integrity:
    name: Manifest and popup asset integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify Node runtime
        run: node --version

      - name: Validate extension manifests and popup assets
        run: node tests/zguard.manifest-integrity.test.js

      - name: Validate bundled Chromium zGuard parity
        run: node tests/zguard.bundle-parity.test.mjs
