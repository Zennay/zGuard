name: Workflow runner availability

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/workflow-runner-availability.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "tests/workflow-runner-availability.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-runner-availability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Reject generic self-hosted runner selection
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify Node runtime
        run: node --version

      - name: Validate workflow runner availability
        run: node tests/workflow-runner-availability.test.mjs
