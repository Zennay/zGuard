# Transient hosted evidence; remove before merge after saving the run.
name: zBrowse credential-free navigation evidence
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbrowse-credential-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-url:
    name: Strict actual gateway credential-free guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Execute live gateway URL policy function against userinfo cases
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.start-url-allowlist.test.mjs --require-credential-free
