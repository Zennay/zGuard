name: zBrowse JSON origin isolation acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_origin_isolation:
        description: "Require foreign Origin and cross-site Fetch Metadata to fail closed before session reuse or allocation"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zbrowse-json-origin-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  origin:
    name: Gateway JSON cross-origin admission
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUIRE_ORIGIN_ISOLATION: ${{ inputs.require_origin_isolation || 'false' }}
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install locked gateway dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix zbrowse/gateway
      - name: Exercise shipped JSON origin boundary
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.cross-origin-json-real-http.test.mjs
          # Enforce authorization before even a successful preflight/JSON body.
          node tests/zbrowse.cross-origin-json-real-http.test.mjs --require-origin-isolation
          if [ "$REQUIRE_ORIGIN_ISOLATION" = "true" ]; then
            node tests/zbrowse.cross-origin-json-real-http.test.mjs --require-origin-isolation
          fi
