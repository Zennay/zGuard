name: Repository JSON syntax validation

on:
  pull_request:
    paths:
      - "**/*.json"
      - "tests/repository-json-syntax.test.mjs"
      - "tests/repository-json-duplicate-keys.test.py"
      - ".github/workflows/repository-json-syntax.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.json"
      - "tests/repository-json-syntax.test.mjs"
      - "tests/repository-json-duplicate-keys.test.py"
      - ".github/workflows/repository-json-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-json-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Parse tracked JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate tracked JSON syntax
        run: node tests/repository-json-syntax.test.mjs

      - name: Reject duplicate JSON object keys
        run: python3 tests/repository-json-duplicate-keys.test.py
