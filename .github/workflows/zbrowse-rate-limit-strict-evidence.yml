# Transient hosted proof: delete after preserving exact-head logs.
name: zBrowse proxy identity strict reproduction
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbrowse-proxy-identity-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-identity:
    name: Strict real Express proxy identity proof
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install locked gateway dependencies with scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix zbrowse/gateway
      - name: Require exact limiter and session identity parity
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.rate-limit-identity-parity.test.mjs --require-key-parity
