name: Workflow token permission boundary

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "tests/workflow-token-permissions.test.mjs"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/workflow-token-permissions.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-token-permission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  permission-boundary:
    name: Workflow token permission boundary gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate workflow token permissions
        run: node tests/workflow-token-permissions.test.mjs
