name: zBrowse gateway Node runtime compatibility

on:
  pull_request:
    paths:
      - "zbrowse/gateway/package.json"
      - "zbrowse/gateway/package-lock.json"
      - "zbrowse/gateway/Dockerfile"
      - "tests/zbrowse.gateway-node-runtime-compatibility.test.mjs"
      - ".github/workflows/gateway-node-runtime-compatibility.yml"
  push:
    branches:
      - main
    paths:
      - "zbrowse/gateway/package.json"
      - "zbrowse/gateway/package-lock.json"
      - "zbrowse/gateway/Dockerfile"
      - "tests/zbrowse.gateway-node-runtime-compatibility.test.mjs"
      - ".github/workflows/gateway-node-runtime-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-gateway-node-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-node-runtime-compatibility:
    name: Gateway Node runtime compatibility contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate gateway Node runtime compatibility
        run: node tests/zbrowse.gateway-node-runtime-compatibility.test.mjs
