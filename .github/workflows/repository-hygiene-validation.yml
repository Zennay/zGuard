name: zBrowse repository hygiene validation

on:
  pull_request:
    paths:
      - ".gitignore"
      - "zbrowse/.env.example"
      - "zbrowse/README.md"
      - "zbrowse/scripts/install.sh"
      - "zbrowse/scripts/validate.sh"
      - "tests/zbrowse.repository-hygiene.test.js"
      - "tests/zbrowse.install-preflight.test.mjs"
      - "tests/zbrowse.validation-entrypoint.test.mjs"
      - "tests/dedicated-workflow-checkout-integrity.test.mjs"
      - ".github/workflows/**"
      - ".github/workflows/repository-hygiene-validation.yml"
  push:
    branches:
      - main
    paths:
      - ".gitignore"
      - "zbrowse/.env.example"
      - "zbrowse/README.md"
      - "zbrowse/scripts/install.sh"
      - "zbrowse/scripts/validate.sh"
      - "tests/zbrowse.repository-hygiene.test.js"
      - "tests/zbrowse.install-preflight.test.mjs"
      - "tests/zbrowse.validation-entrypoint.test.mjs"
      - "tests/dedicated-workflow-checkout-integrity.test.mjs"
      - ".github/workflows/**"
      - ".github/workflows/repository-hygiene-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-repository-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate portable zBrowse quality entrypoint
        shell: bash
        run: |
          set -euo pipefail
          bash zbrowse/scripts/validate.sh
          node tests/dedicated-workflow-checkout-integrity.test.mjs
          git check-ignore -q zbrowse/.env
          if git check-ignore -q zbrowse/.env.example; then
            echo "zbrowse/.env.example must remain trackable" >&2
            exit 1
          fi
