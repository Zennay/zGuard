name: Repository generated-artifact hygiene

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-generated-artifact-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Reject generated tracked artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate tracked artifact hygiene
        run: node tests/repository-generated-artifact-hygiene.test.mjs
