name: zBrowse rate limit identity parity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_key_parity:
        description: "Require the real Express limiter key to match gateway session identity on incomplete trusted proxy chains"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zbrowse-rate-limit-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proxy-identity:
    name: Real Express rate-limit identity boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUIRE_KEY_PARITY: ${{ inputs.require_key_parity || 'false' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install locked gateway dependencies with scripts disabled
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix zbrowse/gateway
      - name: Exercise actual limiter and session identity resolver
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.gateway-strict-acceptance-cli.test.mjs
          node tests/zbrowse.rate-limit-cli.test.mjs
          node tests/zbrowse.rate-limit-identity-parity.test.mjs
          node tests/zbrowse.actual-session-limiter.test.mjs
          if [ "$REQUIRE_KEY_PARITY" = "true" ]; then
            node tests/zbrowse.rate-limit-identity-parity.test.mjs --require-key-parity
            node tests/zbrowse.actual-session-limiter.test.mjs --require-source-parity
          fi
