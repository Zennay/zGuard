name: Repository JavaScript syntax validation

# Always on: executable Node shebang tools and casefolded script suffixes
# are not discoverable by the old lowercase extension-only event paths.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-javascript-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Parse tracked JavaScript
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate tracked JavaScript syntax
        run: node tests/repository-javascript-syntax.test.mjs

      - name: Reject runtime JavaScript code generation
        run: node tests/repository-javascript-runtime-safety.test.mjs
