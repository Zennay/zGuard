name: Repository JavaScript syntax validation

on:
  pull_request:
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "tests/repository-javascript-syntax.test.mjs"
      - "tests/repository-javascript-runtime-safety.test.mjs"
      - ".github/workflows/repository-javascript-syntax.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.cjs"
      - "tests/repository-javascript-syntax.test.mjs"
      - "tests/repository-javascript-runtime-safety.test.mjs"
      - ".github/workflows/repository-javascript-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-javascript-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Parse tracked JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate tracked JavaScript syntax
        run: node tests/repository-javascript-syntax.test.mjs

      - name: Reject runtime JavaScript code generation
        run: node tests/repository-javascript-runtime-safety.test.mjs
