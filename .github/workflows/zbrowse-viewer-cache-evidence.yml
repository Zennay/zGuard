# Evidence-only workflow, removed from PR after verifying source-run output.
name: zBrowse viewer proxy strict privacy evidence
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbrowse-viewer-cache-repro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-viewer:
    name: Strict viewer upstream no-store proof
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Run strict authenticated viewer cache privacy
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.viewer-cache-privacy.test.mjs --require-no-store
