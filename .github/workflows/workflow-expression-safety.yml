name: Workflow expression safety

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/workflow-expression-safety.test.mjs"
      - ".github/workflows/workflow-expression-safety.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "tests/workflow-expression-safety.test.mjs"
      - ".github/workflows/workflow-expression-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-workflow-expression-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expression-safety:
    name: Workflow expression safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate workflow expression boundaries
        run: node tests/workflow-expression-safety.test.mjs
