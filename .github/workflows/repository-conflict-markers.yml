name: Repository conflict marker validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-conflict-markers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Scan tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Reject unresolved conflict markers
        run: node tests/repository-conflict-markers.test.mjs
