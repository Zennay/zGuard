name: Repository Python syntax validation

on:
  pull_request:
    paths:
      - "**/*.py"
      - "tests/repository-python-syntax.test.py"
      - ".github/workflows/repository-python-syntax.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - "tests/repository-python-syntax.test.py"
      - ".github/workflows/repository-python-syntax.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-python-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Parse tracked Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate tracked Python syntax
        run: python3 tests/repository-python-syntax.test.py
