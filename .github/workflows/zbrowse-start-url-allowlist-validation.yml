name: zBrowse start URL allowlist validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbrowse-start-url-allowlist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Gateway start URL origin allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout PR-head source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Exercise gateway URL guard
        run: node tests/zbrowse.start-url-allowlist.test.mjs
