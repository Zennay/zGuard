name: zBrowse start URL allowlist validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_credential_free:
        description: "Reject username/password userinfo even at an approved gateway origin (issue #266)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zbrowse-start-url-allowlist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Gateway start URL origin allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUIRE_CREDENTIAL_FREE: ${{ inputs.require_credential_free || 'false' }}
    steps:
      - name: Checkout PR-head source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Exercise gateway URL guard
        shell: bash
        run: |
          set -euo pipefail
          node tests/zbrowse.gateway-strict-acceptance-cli.test.mjs
          node tests/zbrowse.start-url-allowlist.test.mjs
          if [ "$REQUIRE_CREDENTIAL_FREE" = "true" ]; then
            node tests/zbrowse.start-url-allowlist.test.mjs --require-credential-free
          fi
