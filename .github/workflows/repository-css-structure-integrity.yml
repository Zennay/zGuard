name: CSS structure integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: css-structure-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tracked CSS structure integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate tracked CSS structure
        run: node tests/repository-css-structure-integrity.test.mjs
