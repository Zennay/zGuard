name: Workflow job timeout validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tests/workflow-job-timeout.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "tests/workflow-job-timeout.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-job-timeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-timeouts:
    name: Workflow job timeout contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate bounded workflow jobs
        run: node tests/workflow-job-timeout.test.mjs
