name: Repository secret hygiene

on:
  pull_request:
    paths:
      - ".github/**"
      - "chromium/**"
      - "firefox/**"
      - "zbrowse/**"
      - "tests/repository-secret-hygiene.test.mjs"
      - ".github/workflows/repository-secret-hygiene.yml"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "chromium/**"
      - "firefox/**"
      - "zbrowse/**"
      - "tests/repository-secret-hygiene.test.mjs"
      - ".github/workflows/repository-secret-hygiene.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-secret-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository secret hygiene contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Scan tracked source/config
        run: node tests/repository-secret-hygiene.test.mjs
