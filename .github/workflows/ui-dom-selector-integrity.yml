name: UI DOM selector integrity

on:
  pull_request:
    paths:
      - "zbrowse/gateway/public/index.html"
      - "zbrowse/gateway/public/app.js"
      - "chromium/popup.html"
      - "chromium/popup.js"
      - "chromium/popup-a11y.js"
      - "firefox/popup.html"
      - "firefox/popup.js"
      - "firefox/popup-a11y.js"
      - "zbrowse/browser/zguard/popup.html"
      - "zbrowse/browser/zguard/popup.js"
      - "zbrowse/browser/zguard/popup-a11y.js"
      - "tests/ui-dom-selector-integrity.test.mjs"
      - ".github/workflows/ui-dom-selector-integrity.yml"
  push:
    branches:
      - main
    paths:
      - "zbrowse/gateway/public/index.html"
      - "zbrowse/gateway/public/app.js"
      - "chromium/popup.html"
      - "chromium/popup.js"
      - "chromium/popup-a11y.js"
      - "firefox/popup.html"
      - "firefox/popup.js"
      - "firefox/popup-a11y.js"
      - "zbrowse/browser/zguard/popup.html"
      - "zbrowse/browser/zguard/popup.js"
      - "zbrowse/browser/zguard/popup-a11y.js"
      - "tests/ui-dom-selector-integrity.test.mjs"
      - ".github/workflows/ui-dom-selector-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-ui-dom-selector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-dom-selector-integrity:
    name: UI DOM selector integrity contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate static UI selectors
        run: node tests/ui-dom-selector-integrity.test.mjs
