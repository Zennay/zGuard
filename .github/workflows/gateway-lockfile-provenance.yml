name: Gateway lockfile provenance

on:
  push:
    branches:
      - main
    paths:
      - "zbrowse/gateway/package.json"
      - "zbrowse/gateway/package-lock.json"
      - "tests/zbrowse.gateway-lockfile-provenance.test.mjs"
      - ".github/workflows/gateway-lockfile-provenance.yml"
  pull_request:
    paths:
      - "zbrowse/gateway/package.json"
      - "zbrowse/gateway/package-lock.json"
      - "tests/zbrowse.gateway-lockfile-provenance.test.mjs"
      - ".github/workflows/gateway-lockfile-provenance.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-lockfile-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-provenance:
    name: Gateway lockfile provenance gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate gateway lockfile provenance
        run: node tests/zbrowse.gateway-lockfile-provenance.test.mjs
