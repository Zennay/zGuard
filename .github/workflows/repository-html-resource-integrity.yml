name: HTML resource integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: html-resource-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tracked HTML resource integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate tracked HTML resources
        run: node tests/repository-html-resource-integrity.test.mjs
