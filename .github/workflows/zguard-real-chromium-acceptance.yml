name: zGuard real Chromium acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_mainworld:
        description: "Require real page MAIN-world window.open interception (issue #3)"
        type: boolean
        default: false
      require_coldstart:
        description: "Require three actual browser cold starts per package (issue #302)"
        type: boolean
        default: false
      require_auxclick:
        description: "Require real native middle-click interception (auxclick)"
        type: boolean
        default: false
      require_shadow_dom:
        description: "Require hostile popup interception through Shadow DOM event retargeting"
        type: boolean
        default: false
      require_form_submit:
        description: "Require hostile form target=_blank submission to be intercepted"
        type: boolean
        default: false
      require_image_map:
        description: "Require hostile image-map area target=_blank interception with native clicks"
        type: boolean
        default: false
      require_svg_link:
        description: "Require native click interception for hostile inline SVG hyperlink"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: real-chromium-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    name: Run real Chromium extension click acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUIRE_MAINWORLD: ${{ inputs.require_mainworld || 'false' }}
      REQUIRE_COLDSTART: ${{ inputs.require_coldstart || 'false' }}
      REQUIRE_AUXCLICK: ${{ inputs.require_auxclick || 'false' }}
      REQUIRE_SHADOW_DOM: ${{ inputs.require_shadow_dom || 'false' }}
      REQUIRE_FORM_SUBMIT: ${{ inputs.require_form_submit || 'false' }}
      REQUIRE_IMAGE_MAP: ${{ inputs.require_image_map || 'false' }}
      REQUIRE_SVG_LINK: ${{ inputs.require_svg_link || 'false' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install exact Chrome for Testing binary
        shell: bash
        run: |
          set -euo pipefail
          CHROME_VERSION=155.0.8059.39
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 15 --max-time 150 \
            "https://storage.googleapis.com/chrome-for-testing-public/${CHROME_VERSION}/linux64/chrome-linux64.zip" \
            -o "$RUNNER_TEMP/chrome-for-testing.zip"
          printf '%s  %s\n' \
            '55672d1f392fd3e7b7a08621b6e804e6bcb39d40cf155504abb74b3a021ea8ea' \
            "$RUNNER_TEMP/chrome-for-testing.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/chrome-for-testing.zip" -d "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/chrome-linux64/chrome"
      - name: Chromium real-browser acceptance
        env:
          CHROMIUM_BIN: ${{ runner.temp }}/chrome-linux64/chrome
        shell: bash
        run: |
          set -euo pipefail
          "$CHROMIUM_BIN" --version
          node tests/zguard.browser-flag-contract.test.mjs
          node tests/zguard.chromium-real-browser.test.mjs
          # Both previously missed non-HTML-anchor popup gestures are required gates.
          node tests/zguard.chromium-real-browser.test.mjs --require-image-map
          node tests/zguard.chromium-real-browser.test.mjs --require-svg-link
          if [ "$REQUIRE_MAINWORLD" = "true" ]; then
            node tests/zguard.chromium-real-browser.test.mjs --require-mainworld
          fi
          if [ "$REQUIRE_COLDSTART" = "true" ]; then
            node tests/zguard.chromium-real-browser.test.mjs --cold-start
          fi
          if [ "$REQUIRE_AUXCLICK" = "true" ]; then
            node tests/zguard.chromium-real-browser.test.mjs --require-auxclick
          fi
          if [ "$REQUIRE_SHADOW_DOM" = "true" ]; then
            node tests/zguard.chromium-real-browser.test.mjs --require-shadow-dom
          fi
          if [ "$REQUIRE_FORM_SUBMIT" = "true" ]; then
            node tests/zguard.chromium-real-browser.test.mjs --require-form-submit
          fi
          if [ "$REQUIRE_IMAGE_MAP" = "true" ]; then
            node tests/zguard.chromium-real-browser.test.mjs --require-image-map
          fi
          if [ "$REQUIRE_SVG_LINK" = "true" ]; then
            node tests/zguard.chromium-real-browser.test.mjs --require-svg-link
          fi
