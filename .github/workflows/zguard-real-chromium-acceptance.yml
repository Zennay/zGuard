name: zGuard real Chromium acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_mainworld:
        description: "Require real page MAIN-world window.open interception (issue #3)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: real-chromium-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    name: Run real Chromium extension click acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Chromium real-browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          google-chrome --version
          node tests/zguard.chromium-real-browser.test.mjs
      - name: Require MAIN-world interception on explicit acceptance dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.require_mainworld
        shell: bash
        run: |
          set -euo pipefail
          node tests/zguard.chromium-real-browser.test.mjs --require-mainworld
