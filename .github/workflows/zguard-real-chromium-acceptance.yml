name: zGuard real Chromium acceptance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      require_mainworld:
        description: "Require real page MAIN-world window.open interception (issue #3)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: real-chromium-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    name: Run real Chromium extension click acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      REQUIRE_MAINWORLD: ${{ inputs.require_mainworld || 'false' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install Chrome for Testing
        id: browser
        uses: browser-actions/setup-chrome@73954683cc80eced513145a42b668b9b91f753c3 # v2.1.2
        with:
          chrome-version: stable
      - name: Chromium real-browser acceptance
        env:
          CHROMIUM_BIN: ${{ steps.browser.outputs.chrome-path }}
        shell: bash
        run: |
          set -euo pipefail
          "$CHROMIUM_BIN" --version
          node tests/zguard.chromium-real-browser.test.mjs
          if [ "$REQUIRE_MAINWORLD" = "true" ]; then
            node tests/zguard.chromium-real-browser.test.mjs --require-mainworld
          fi
