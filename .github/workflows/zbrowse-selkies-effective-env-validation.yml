name: zBrowse effective Selkies inspect QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbrowse-selkies-effective-inspect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-contract:
    name: Effective Selkies Docker inspect contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert checked-out source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Exercise strict effective-env parser on synthetic inspect JSON
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/zbrowse-selkies-effective-posture.mjs
          node tests/zbrowse.selkies-effective-env.test.mjs
          test -z "$(git status --porcelain)"
