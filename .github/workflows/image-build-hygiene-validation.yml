name: zBrowse image build hygiene validation

on:
  pull_request:
    paths:
      - 'zbrowse/browser/Dockerfile'
      - 'zbrowse/browser/.dockerignore'
      - 'zbrowse/gateway/Dockerfile'
      - 'zbrowse/gateway/.dockerignore'
      - 'tests/zbrowse.image-build-hygiene.test.mjs'
      - '.github/workflows/image-build-hygiene-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'zbrowse/browser/Dockerfile'
      - 'zbrowse/browser/.dockerignore'
      - 'zbrowse/gateway/Dockerfile'
      - 'zbrowse/gateway/.dockerignore'
      - 'tests/zbrowse.image-build-hygiene.test.mjs'
      - '.github/workflows/image-build-hygiene-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-image-build-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-build-hygiene:
    name: Container build hygiene contract
    if: ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || (github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Zennay'))
    runs-on: [self-hosted, portfolio-pool, vps]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify Node runtime
        run: node --version

      - name: Validate container build hygiene
        run: node tests/zbrowse.image-build-hygiene.test.mjs
