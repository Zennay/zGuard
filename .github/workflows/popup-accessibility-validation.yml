name: zGuard popup accessibility validation

on:
  pull_request:
    paths:
      - "chromium/popup.html"
      - "chromium/popup.css"
      - "chromium/popup.js"
      - "firefox/popup.html"
      - "firefox/popup.css"
      - "firefox/popup.js"
      - "zbrowse/browser/zguard/popup.html"
      - "zbrowse/browser/zguard/popup.css"
      - "zbrowse/browser/zguard/popup.js"
      - "tests/zguard.popup-accessibility.test.mjs"
      - "tests/zguard.popup-a11y-runtime.test.js"
      - "tests/zguard.popup-workflow-coverage.test.mjs"
      - "chromium/popup-a11y.js"
      - "firefox/popup-a11y.js"
      - "zbrowse/browser/zguard/popup-a11y.js"
      - ".github/workflows/popup-accessibility-validation.yml"
  push:
    branches:
      - main
    paths:
      - "chromium/popup.html"
      - "chromium/popup.css"
      - "chromium/popup.js"
      - "firefox/popup.html"
      - "firefox/popup.css"
      - "firefox/popup.js"
      - "zbrowse/browser/zguard/popup.html"
      - "zbrowse/browser/zguard/popup.css"
      - "zbrowse/browser/zguard/popup.js"
      - "tests/zguard.popup-accessibility.test.mjs"
      - "tests/zguard.popup-a11y-runtime.test.js"
      - "tests/zguard.popup-workflow-coverage.test.mjs"
      - "chromium/popup-a11y.js"
      - "firefox/popup-a11y.js"
      - "zbrowse/browser/zguard/popup-a11y.js"
      - ".github/workflows/popup-accessibility-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zguard-popup-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  popup-accessibility:
    name: Popup accessibility contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate popup accessibility contract
        shell: bash
        run: |
          set -euo pipefail
          node tests/zguard.popup-accessibility.test.mjs
          node tests/zguard.popup-a11y-runtime.test.js
          node tests/zguard.popup-workflow-coverage.test.mjs
