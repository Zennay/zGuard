name: zBrowse sites config safety

on:
  pull_request:
    paths:
      - "zbrowse/gateway/config/sites.json"
      - "tests/zbrowse.sites-config-safety.test.mjs"
      - ".github/workflows/zbrowse-sites-config-safety.yml"
  push:
    branches:
      - main
    paths:
      - "zbrowse/gateway/config/sites.json"
      - "tests/zbrowse.sites-config-safety.test.mjs"
      - ".github/workflows/zbrowse-sites-config-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbrowse-sites-config-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Sites configuration safety contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checkout commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate sites configuration
        run: node tests/zbrowse.sites-config-safety.test.mjs
